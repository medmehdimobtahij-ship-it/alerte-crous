name: Alerte CROUS

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:         # bouton "Run workflow" pour tester à la main

permissions:
  contents: write            # pour enregistrer deja_vus.json entre deux passages

concurrency:
  group: alerte-crous
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les logements
        env:
          WHATSAPP_NUMERO: ${{ secrets.WHATSAPP_NUMERO }}
          CALLMEBOT_CLE: ${{ secrets.CALLMEBOT_CLE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python alerte_crous.py --une-fois
      - name: Mémoriser les logements déjà signalés
        run: |
          git config user.name "alerte-crous"
          git config user.email "alerte-crous@users.noreply.github.com"
          git add deja_vus.json
          git diff --cached --quiet || (git commit -m "maj deja_vus" && git push)
